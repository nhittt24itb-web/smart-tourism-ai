<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác Thực Tài Khoản - Smart Tourism AI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Thư viện Đăng nhập Google chính thức -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8 relative">

  <a href="index.html" class="fixed top-6 left-6 z-30 inline-flex items-center gap-2 bg-white/90 backdrop-blur-md px-4 py-2 rounded-full text-xs font-bold text-slate-700 shadow-md hover:bg-white transition">
    <i data-lucide="arrow-left" class="w-4 h-4"></i> Quay Lại Trang Chủ
  </a>

  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-2 min-h-[600px]">
    
    <div class="relative min-h-[300px] lg:min-h-full overflow-hidden">
      <img src="assets/images/anh2.jpg" alt="Phong cảnh Việt Nam" class="absolute inset-0 w-full h-full object-cover object-left md:object-[18%_center]">
      <div class="absolute inset-0 bg-emerald-950/10"></div>
    </div>

    <div class="p-8 md:p-12 flex flex-col justify-center">
      
      <div class="mb-6">
        <h1 id="auth-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">
          Chào Mừng Trở Lại!
        </h1>
        <p id="auth-subtitle" class="text-xs md:text-sm font-medium text-slate-500 mt-2">
          Đăng nhập để khám phá lịch trình AI cá nhân hóa và các địa điểm phù hợp nhất dành riêng cho bạn.
        </p>
      </div>

      <div class="flex items-center p-1 bg-slate-100 rounded-full mb-8 max-w-sm border border-slate-200">
        <button id="btn-signin" type="button" onclick="switchTab('signin')" class="flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 bg-emerald-800 text-white shadow-md">
          Đăng Nhập
        </button>
        <button id="btn-signup" type="button" onclick="switchTab('signup')" class="flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 text-slate-600 hover:text-slate-900">
          Đăng Ký
        </button>
      </div>

      <!-- FORM SIGN IN -->
      <form id="form-signin" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Email</label>
          <input type="email" id="signin-email" placeholder="Nhập địa chỉ email của bạn" required class="w-full px-5 py-3 rounded-full border border-emerald-800/40 focus:border-emerald-800 focus:ring-2 focus:ring-emerald-800/20 outline-none text-sm font-semibold text-slate-800 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Mật Khẩu</label>
          <input type="password" id="signin-password" placeholder="Nhập mật khẩu" required class="w-full px-5 py-3 rounded-full border border-emerald-800/40 focus:border-emerald-800 focus:ring-2 focus:ring-emerald-800/20 outline-none text-sm font-semibold text-slate-800 transition">
        </div>

        <div id="signin-alert" class="hidden text-xs font-semibold p-2.5 rounded-xl border"></div>

        <div class="flex justify-between items-center text-xs">
          <label class="inline-flex items-center gap-1.5 text-slate-600 cursor-pointer">
            <input type="checkbox" checked class="rounded border-slate-300 text-emerald-800 focus:ring-emerald-800"> Ghi nhớ đăng nhập
          </label>
          <a href="#" class="font-semibold text-slate-500 hover:text-emerald-800 transition">Quên mật khẩu?</a>
        </div>

        <button type="submit" id="btn-submit-signin" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-black py-3.5 px-4 rounded-full shadow-md hover:shadow-lg transition text-xs tracking-wider uppercase">
          ĐĂNG NHẬP
        </button>

        <div class="relative my-4 text-center">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
          <span class="relative bg-white px-3 text-xs text-slate-400 font-medium">HOẶC ĐĂNG NHẬP VỚI</span>
        </div>

<!-- NÚT ĐĂNG NHẬP GOOGLE -->
        <button type="button" onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-full border border-slate-200 hover:bg-slate-50 transition text-xs font-bold text-slate-700 shadow-sm mt-3">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Tiếp tục với Google</span>
        </button>      </form>

      <!-- FORM SIGN UP -->
      <form id="form-signup" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Họ và Tên</label>
          <input type="text" id="signup-fullname" placeholder="Nhập họ và tên đầy đủ" required class="w-full px-5 py-3 rounded-full border border-emerald-800/40 focus:border-emerald-800 focus:ring-2 focus:ring-emerald-800/20 outline-none text-sm font-semibold text-slate-800 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Email</label>
          <input type="email" id="signup-email" placeholder="Nhập địa chỉ email" required class="w-full px-5 py-3 rounded-full border border-emerald-800/40 focus:border-emerald-800 focus:ring-2 focus:ring-emerald-800/20 outline-none text-sm font-semibold text-slate-800 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Mật Khẩu</label>
          <input type="password" id="signup-password" placeholder="Tạo mật khẩu an toàn" required class="w-full px-5 py-3 rounded-full border border-emerald-800/40 focus:border-emerald-800 focus:ring-2 focus:ring-emerald-800/20 outline-none text-sm font-semibold text-slate-800 transition">
        </div>

        <div id="signup-alert" class="hidden text-xs font-semibold p-2.5 rounded-xl border"></div>

        <button type="submit" id="btn-submit-signup" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-black py-3.5 px-6 rounded-full shadow-md hover:shadow-lg transition text-xs tracking-wider uppercase mt-2">
          ĐĂNG KÝ
        </button>
      </form>

    </div>
  </div>

  <script>
    lucide.createIcons();
    const API_BASE = "http://127.0.0.1:8000/api";

    // 1. Chuyển đổi qua lại giữa tab Đăng nhập và Đăng ký
    function switchTab(tab) {
      const btnSignin = document.getElementById('btn-signin');
      const btnSignup = document.getElementById('btn-signup');
      const formSignin = document.getElementById('form-signin');
      const formSignup = document.getElementById('form-signup');
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');

      document.getElementById('signin-alert').classList.add('hidden');
      document.getElementById('signup-alert').classList.add('hidden');

      if (tab === 'signin') {
        btnSignin.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 bg-emerald-800 text-white shadow-md";
        btnSignup.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 text-slate-600 hover:text-slate-900";
        formSignin.classList.remove('hidden');
        formSignup.classList.add('hidden');
        title.innerText = "Chào Mừng Trở Lại!";
        subtitle.innerText = "Đăng nhập để khám phá lịch trình AI cá nhân hóa và các địa điểm phù hợp nhất dành riêng cho bạn.";
      } else {
        btnSignup.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 bg-emerald-800 text-white shadow-md";
        btnSignin.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all duration-300 text-slate-600 hover:text-slate-900";
        formSignup.classList.remove('hidden');
        formSignin.classList.add('hidden');
        title.innerText = "Bắt Đầu Hành Trình Mới";
        subtitle.innerText = "Tạo tài khoản để nhận các lịch trình tự động được xây dựng bởi Trí tuệ nhân tạo.";
      }
    }

    // 2. Xử lý Đăng Nhập thông thường
    document.getElementById('form-signin').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;
      const alertBox = document.getElementById('signin-alert');
      const submitBtn = document.getElementById('btn-submit-signin');

      alertBox.classList.add('hidden');
      submitBtn.innerText = "ĐANG XỬ LÝ...";
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          alertBox.className = "text-xs font-semibold text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 block";
          alertBox.innerText = "Đăng nhập thành công! Đang chuyển hướng...";
          setTimeout(() => { window.location.href = "index.html"; }, 800);
        } else {
          alertBox.className = "text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-200 block";
          alertBox.innerText = data.detail || "Email hoặc mật khẩu không chính xác!";
        }
      } catch (err) {
        alertBox.className = "text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-200 block";
        alertBox.innerText = "Không thể kết nối đến máy chủ. Vui lòng kiểm tra backend FastAPI.";
      } finally {
        submitBtn.innerText = "ĐĂNG NHẬP";
        submitBtn.disabled = false;
      }
    });

    // 3. Xử lý Đăng Ký
    document.getElementById('form-signup').addEventListener('submit', async function(e) {
      e.preventDefault();
      const full_name = document.getElementById('signup-fullname').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const alertBox = document.getElementById('signup-alert');
      const submitBtn = document.getElementById('btn-submit-signup');

      alertBox.classList.add('hidden');
      submitBtn.innerText = "ĐANG TẠO TÀI KHOẢN...";
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, password })
        });

        const data = await res.json();

        if (res.ok) {
          alertBox.className = "text-xs font-semibold text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 block";
          alertBox.innerText = "Đăng ký thành công! Đang chuyển sang tab đăng nhập...";
          setTimeout(() => {
            switchTab('signin');
            document.getElementById('signin-email').value = email;
          }, 1000);
        } else {
          alertBox.className = "text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-200 block";
          alertBox.innerText = data.detail || "Đăng ký không thành công!";
        }
      } catch (err) {
        alertBox.className = "text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-200 block";
        alertBox.innerText = "Lỗi kết nối máy chủ!";
      } finally {
        submitBtn.innerText = "ĐĂNG KÝ";
        submitBtn.disabled = false;
      }
    });

    // 4. Xử lý Đăng Nhập Google (Đặt ở phạm vi toàn cục)
    async function loginWithGoogle() {
      const defaultEmail = "tranthithaonhi101999@gmail.com";
      const email = prompt("Đăng nhập bằng tài khoản Google:", defaultEmail);
      if (!email) return;

      const name = email.split('@')[0];
      const alertBox = document.getElementById('signin-alert');

      try {
        const res = await fetch(`${API_BASE}/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            name: name,
            avatar_url: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde"
          })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          alertBox.className = "text-xs font-semibold text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 block";
          alertBox.innerText = `Đăng nhập Google thành công với tài khoản: ${email}! Đang chuyển hướng...`;
          setTimeout(() => { window.location.href = "index.html"; }, 800);
        } else {
          alertBox.className = "text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-200 block";
          alertBox.innerText = data.detail || "Không thể đăng nhập tài khoản Google!";
        }
      } catch (err) {
        alertBox.className = "text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-200 block";
        alertBox.innerText = "Lỗi kết nối máy chủ!";
      }
    }
  </script>
</body>
</html>
